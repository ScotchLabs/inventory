name: sns-inventory-aws

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${postgres_db}
      POSTGRES_USER: ${postgres_user}
      POSTGRES_PASSWORD: ${postgres_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/efs/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${postgres_user} -d ${postgres_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    image: sns-inventory-backend:latest
    container_name: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${postgres_user}:${postgres_password}@postgres:5432/${postgres_db}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      WEB_ROOT_URL: ${WEB_ROOT_URL}
      API_ROOT_URL: ${API_ROOT_URL}
      FASTAPI_SESSION_SECRET: ${FASTAPI_SESSION_SECRET}
      DEPLOYMENT_TYPE: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - app-network

  frontend:
    image: sns-inventory-frontend:latest
    container_name: frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /mnt/efs/letsencrypt:/etc/letsencrypt
      - /mnt/efs/certbot:/var/www/certbot
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge